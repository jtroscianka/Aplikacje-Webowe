<!doctype html>

<body>

  <nav>
    <a href="index.html">O mnie</a>

  <main>
    <section>
      <h2>Galeria</h2>
      <div class="container">
        <div class="smallBox">
          <img src="img/1.jpg" alt="Czarodziej uciekający przed potworami" />

  <footer>
    <p>© Jan Trościanka 2026</p>
